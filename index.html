<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>22Home</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <a href="#" class="brand" data-home>
    <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
      <rect class="bm b1" x="4"  y="20" width="8" height="16" rx="1"/>
      <rect class="bm b2" x="16" y="10" width="8" height="26" rx="1"/>
      <rect class="bm b3" x="28" y="4"  width="8" height="32" rx="1"/>
    </svg>
    <span data-sitename>22Home</span>
  </a>
  <span class="updated" id="last-updated"></span>
</header>

<!-- ───── صحنهٔ متحرک شهر ───── -->
<section class="hero" id="hero">
  <svg class="city" viewBox="0 0 1200 260" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f7f8fa"/><stop offset="1" stop-color="#eef1f5"/>
      </linearGradient>
      <pattern id="win" width="12" height="14" patternUnits="userSpaceOnUse">
        <rect class="win" x="2" y="3" width="5" height="6" rx="0.5"/>
      </pattern>
    </defs>
    <rect width="1200" height="260" fill="url(#sky)"/>
    <!-- خورشید/ماه -->
    <circle class="sun" cx="1010" cy="70" r="22"/>
    <!-- ابرها -->
    <g class="cloud c1"><ellipse cx="0" cy="0" rx="46" ry="14"/><ellipse cx="-22" cy="-8" rx="24" ry="14"/><ellipse cx="18" cy="-9" rx="28" ry="16"/></g>
    <g class="cloud c2"><ellipse cx="0" cy="0" rx="36" ry="11"/><ellipse cx="-16" cy="-6" rx="18" ry="11"/><ellipse cx="14" cy="-7" rx="20" ry="12"/></g>
    <!-- ساختمان‌های پس‌زمینه -->
    <g class="back">
      <rect x="40"  y="150" width="60" height="110"/>
      <rect x="130" y="120" width="40" height="140"/>
      <rect x="300" y="160" width="90" height="100"/>
      <rect x="520" y="140" width="50" height="120"/>
      <rect x="700" y="170" width="70" height="90"/>
      <rect x="900" y="130" width="60" height="130"/>
      <rect x="1100" y="150" width="70" height="110"/>
    </g>
    <!-- ساختمان‌های جلو با پنجره -->
    <g class="front">
      <g class="bld" style="--d:0s"><rect x="190" y="90" width="70" height="170"/><rect x="190" y="90" width="70" height="170" fill="url(#win)"/></g>
      <g class="bld" style="--d:.3s"><rect x="420" y="70" width="60" height="190"/><rect x="420" y="70" width="60" height="190" fill="url(#win)"/></g>
      <g class="bld" style="--d:.6s"><rect x="780" y="100" width="90" height="160"/><rect x="780" y="100" width="90" height="160" fill="url(#win)"/></g>
      <g class="bld" style="--d:.9s"><rect x="1000" y="120" width="50" height="140"/><rect x="1000" y="120" width="50" height="140" fill="url(#win)"/></g>
    </g>
    <!-- ساختمان در حال ساخت (اسکلت) -->
    <g class="frame" transform="translate(600,60)">
      <g class="floors">
        <rect class="fl" x="0" y="180" width="90" height="4"/><rect class="fl" x="0" y="150" width="90" height="4"/>
        <rect class="fl" x="0" y="120" width="90" height="4"/><rect class="fl" x="0" y="90"  width="90" height="4"/>
        <rect class="fl" x="0" y="60"  width="90" height="4"/><rect class="fl" x="0" y="30"  width="90" height="4"/>
      </g>
      <rect class="col" x="0"  y="30" width="4" height="170"/>
      <rect class="col" x="43" y="30" width="4" height="170"/>
      <rect class="col" x="86" y="30" width="4" height="170"/>
    </g>
    <!-- جرثقیل -->
    <g class="crane" transform="translate(560,0)">
      <rect class="mast" x="0" y="20" width="8" height="240"/>
      <g class="jib">
        <rect x="-60" y="14" width="200" height="6"/>
        <rect x="-70" y="8" width="24" height="18"/>
        <g class="hook">
          <line x1="110" y1="20" x2="110" y2="70"/>
          <rect class="load" x="98" y="70" width="24" height="12"/>
        </g>
      </g>
    </g>
    <!-- زمین و ماشین‌ها -->
    <rect class="ground" x="0" y="258" width="1200" height="2"/>
    <g class="car car1"><rect x="0" y="0" width="30" height="10" rx="3"/><circle cx="7" cy="11" r="3"/><circle cx="23" cy="11" r="3"/></g>
    <g class="car car2"><rect x="0" y="0" width="24" height="9" rx="3"/><circle cx="6" cy="10" r="3"/><circle cx="18" cy="10" r="3"/></g>
  </svg>
  <div class="hero-stats" id="hero-stats"></div>
</section>

<!-- ───── جستجو و فیلتر ───── -->
<section class="tools" id="tools">
  <div class="search">
    <svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
    <input id="q" type="search" placeholder="جستجو در نام پروژه، محله، سازنده…" autocomplete="off">
  </div>
  <div class="filters">
    <div class="group" data-filter="type"><span class="lbl">کاربری</span><div class="chips" id="f-type"></div></div>
    <div class="group" data-filter="region"><span class="lbl">منطقه</span><div class="chips" id="f-region"></div></div>
    <div class="group" data-filter="status"><span class="lbl">وضعیت</span><div class="chips" id="f-status"></div></div>
    <div class="group"><span class="lbl">مرتب‌سازی</span>
      <select id="sort">
        <option value="updated">آخرین به‌روزرسانی</option>
        <option value="price-asc">قیمت متری ↑</option>
        <option value="price-desc">قیمت متری ↓</option>
        <option value="progress">پیشرفت فیزیکی</option>
        <option value="delivery">زمان تحویل</option>
      </select>
    </div>
  </div>
  <div class="result-count" id="count"></div>
</section>

<!-- ───── لیست پروژه‌ها ───── -->
<main class="grid" id="grid"></main>

<!-- ───── صفحهٔ جزئیات ───── -->
<section class="detail" id="detail" hidden></section>

<footer class="foot">
  <span id="foot-contact"></span>
  <span>داده‌ها از شیت مرکزی خوانده می‌شوند و به‌صورت خودکار به‌روز هستند.</span>
</footer>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
